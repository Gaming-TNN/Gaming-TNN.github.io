name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Called by refresh-characters.yml after it publishes new data to
  # data-live. Also available by hand. GITHUB_TOKEN may workflow_dispatch
  # another workflow (a documented exception, with repository_dispatch);
  # this file is a reusable workflow so refresh can workflow_call it in
  # the same run instead of relying on that dispatch exception.
  workflow_dispatch:
  workflow_call:

# Least privilege: read-only by default; Pages/OIDC write is granted to the deploy job only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Overlay the published snapshots so a push to main cannot roll
      # site data back to whatever is committed on main, and so a data
      # refresh (which only updates data-live) still deploys the latest
      # characters, talent trees, and profession icons.
      - name: Checkout published data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data-live
          path: .data-branch
          persist-credentials: false
      - name: Overlay data-live onto the site
        run: |
          set -euo pipefail
          for p in src/data/characters src/data/talent-trees src/data/professions; do
            if [ ! -d ".data-branch/$p" ]; then
              echo "Missing $p on the data-live branch; refusing to deploy stale or partial data."
              exit 1
            fi
            rm -rf "$p"
            mkdir -p "$(dirname "$p")"
            cp -a ".data-branch/$p" "$p"
          done
          rm -rf .data-branch
          echo "Overlaid data-live:"
          git status --short -- src/data || true
      - name: Install, build, and upload site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
