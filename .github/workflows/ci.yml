name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # workflow_dispatch is used by refresh-characters.yml so the required
  # "build" check can run on PRs opened with GITHUB_TOKEN (those events
  # do not trigger pull_request or push workflows). Dispatch against the
  # PR branch so the check run attaches to that head SHA.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check CNAME ships in dist
        run: test "$(cat dist/CNAME)" = "gaming.top-notchnetwork.com"
