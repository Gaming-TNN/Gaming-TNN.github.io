# Refresh WoW Forever character snapshots, talent-tree layouts, and
# profession icons from the Battle.net APIs.
#
# When (and only when) the diff is limited to src/data/characters/**,
# src/data/talent-trees/**, and src/data/professions/**, and this
# workflow is running on the default branch, the new data is committed
# to the unprotected data-live branch (a regular commit, never a
# force-push) and this workflow then calls deploy.yml so Pages is built
# from main with those data files overlaid.
#
# The branch is named data-live, not data, because Git cannot create
# refs/heads/data while refs/heads/data/wow-characters still exists.
# data/wow-characters is left in place and is no longer updated here.
#
# Unchanged data produces no commit and does not call deploy. Unexpected
# files outside the data paths fail the job so they can be reviewed.
#
# GITHUB_TOKEN is enough: it can push to the unprotected data-live
# branch (contents: write), and deploy is invoked with workflow_call
# (same run; no “token cannot trigger workflows” issue). workflow_dispatch
# of another workflow also works with GITHUB_TOKEN (GitHub’s documented
# exception, along with repository_dispatch), but calling deploy.yml
# directly is simpler and does not depend on that.
#
# The Cloudflare worker can keep dispatching this workflow on main
# (workflow_dispatch, ref main).
#
# Required repository secrets (do not commit them):
#   BNET_CLIENT_ID
#   BNET_CLIENT_SECRET
# Unused by this workflow (safe to delete from repo secrets):
#   DATA_PR_TOKEN — previously used to open and squash-merge data PRs.

name: Refresh character data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-characters
  cancel-in-progress: false

jobs:
  refresh:
    name: fetch-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.publish.outputs.published || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Fetch character snapshots and talent trees
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: node scripts/fetch-characters.mjs

      - name: Classify changes
        id: changes
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --porcelain --untracked-files=all | while IFS= read -r line; do
            printf '%s\n' "${line:3}"
          done)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "No data changes; nothing to publish."
            exit 0
          fi
          data_only=true
          for path in "${files[@]}"; do
            case "$path" in
              src/data/characters/*|src/data/talent-trees/*|src/data/professions/*) ;;
              *)
                data_only=false
                ;;
            esac
            printf 'changed: %s\n' "$path"
          done
          {
            echo "has_changes=true"
            echo "data_only=${data_only}"
            echo "changed_files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "has_changes=true data_only=${data_only}"

      - name: Fail if unexpected files changed
        if: steps.changes.outputs.has_changes == 'true' && steps.changes.outputs.data_only != 'true'
        run: |
          echo "Refresh produced changes outside src/data/characters/, src/data/talent-trees/, and src/data/professions/. Not publishing."
          exit 1

      - name: Skip publish on non-default branch
        if: steps.changes.outputs.has_changes == 'true' && github.ref_name != github.event.repository.default_branch
        run: echo "Changes found, but data-live is only updated when this workflow runs on the default branch. Skipping publish."

      - name: Build site with the new data
        if: >
          steps.changes.outputs.has_changes == 'true' &&
          steps.changes.outputs.data_only == 'true' &&
          github.ref_name == github.event.repository.default_branch
        run: npm ci && npm run build

      - name: Commit data to data-live
        id: publish
        if: >
          steps.changes.outputs.has_changes == 'true' &&
          steps.changes.outputs.data_only == 'true' &&
          github.ref_name == github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DATA_BRANCH: data-live
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stash_dir=$(mktemp -d)
          mapfile -t files < <(git status --porcelain --untracked-files=all | while IFS= read -r line; do
            printf '%s\n' "${line:3}"
          done)
          for path in "${files[@]}"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              mkdir -p "$stash_dir/$(dirname "$path")"
              cp -a "$path" "$stash_dir/$path"
            else
              mkdir -p "$stash_dir/$(dirname "$path")"
              printf 'deleted\n' > "$stash_dir/${path}.__deleted__"
            fi
          done

          git reset --hard HEAD
          git clean -fd -- src/data/characters src/data/talent-trees src/data/professions

          git fetch origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if git fetch origin "refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"; then
            git checkout -B "$DATA_BRANCH" "origin/${DATA_BRANCH}"
          else
            echo "No existing ${DATA_BRANCH} branch; creating it from ${DEFAULT_BRANCH}."
            git checkout -B "$DATA_BRANCH" "origin/${DEFAULT_BRANCH}"
          fi

          for path in "${files[@]}"; do
            deleted_mark="${stash_dir}/${path}.__deleted__"
            if [ -f "$deleted_mark" ]; then
              rm -f "$path" "$deleted_mark"
              continue
            fi
            if [ -e "${stash_dir}/${path}" ] || [ -L "${stash_dir}/${path}" ]; then
              mkdir -p "$(dirname "$path")"
              rm -rf "$path"
              cp -a "${stash_dir}/${path}" "$path"
            fi
          done

          git add -- src/data/characters src/data/talent-trees src/data/professions
          if git diff --cached --quiet; then
            echo "No new data commit; ${DATA_BRANCH} already has this tree."
            exit 0
          fi

          when=$(date -u +'%Y-%m-%d %H:%M UTC')
          names=$(git diff --cached --name-only | xargs -n1 basename | awk '{printf sep $0; sep=", "}')
          git commit -m "data: refresh ${when} (${names})"
          git push origin "HEAD:refs/heads/${DATA_BRANCH}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published to ${DATA_BRANCH}: data: refresh ${when} (${names})"

  deploy:
    name: deploy
    needs: refresh
    if: needs.refresh.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
