# Refresh WoW Forever character snapshots and talent-tree cache from the
# Battle.net APIs and open a pull request.
#
# When (and only when) the diff is limited to src/data/characters/** and
# src/data/talent-trees/**, the PR targets the default branch, and the
# required "build" check passes, this workflow squash-merges the PR and
# then dispatches the Deploy to GitHub Pages workflow. Any other files
# keep the PR open for Seth's go-ahead. Unchanged data produces no PR.
#
# Pushes and pull requests made with GITHUB_TOKEN do not trigger other
# workflows, so CI is started with workflow_dispatch on the data branch
# (the "build" check attaches to that head SHA) and deploy is started
# with workflow_dispatch on main after the merge.
#
# Required repository secrets (add later; do not commit them):
#   BNET_CLIENT_ID
#   BNET_CLIENT_SECRET
#
# A unique branch is used for each run so the data branch is not force-pushed.
# Data branches are not deleted after the PR is opened or merged.

name: Refresh character data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-characters
  cancel-in-progress: false

jobs:
  refresh:
    name: fetch-and-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Fetch character snapshots and talent trees
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: node scripts/fetch-characters.mjs

      - name: Classify changes
        id: changes
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --porcelain --untracked-files=all | while IFS= read -r line; do
            printf '%s\n' "${line:3}"
          done)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "No data changes; skipping PR."
            exit 0
          fi
          data_only=true
          for path in "${files[@]}"; do
            case "$path" in
              src/data/characters/*|src/data/talent-trees/*) ;;
              *)
                data_only=false
                ;;
            esac
            printf 'changed: %s\n' "$path"
          done
          {
            echo "has_changes=true"
            echo "data_only=${data_only}"
            echo "changed_files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "has_changes=true data_only=${data_only}"

      - name: Build site (data-only auto-merge path)
        id: prebuild
        if: steps.changes.outputs.has_changes == 'true' && steps.changes.outputs.data_only == 'true' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        run: npm ci && npm run build

      - name: Open data-only pull request
        id: cpr_data
        if: steps.changes.outputs.has_changes == 'true' && steps.changes.outputs.data_only == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: ${{ github.ref_name }}
          branch: data/wow-characters-${{ github.run_id }}
          delete-branch: false
          add-paths: |
            src/data/characters
            src/data/talent-trees
          commit-message: |
            Update WoW Forever character snapshots

            Snapshot and talent-tree cache written by scripts/fetch-characters.mjs
            from the Battle.net Profile and Game Data APIs.
          title: Update WoW Forever character snapshots
          body: |
            Automated snapshot of member WoW Forever characters and talent-tree cache from the official Battle.net APIs.

            This PR only updates JSON under `src/data/characters/` and `src/data/talent-trees/`. When it targets the default branch and the required `build` check passes, the Refresh character data workflow squash-merges it and dispatches the Pages deploy workflow. It does not force-push or delete its data branch.
          labels: data

      - name: Open pull request for unexpected files
        if: steps.changes.outputs.has_changes == 'true' && steps.changes.outputs.data_only == 'false'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: ${{ github.ref_name }}
          branch: data/wow-characters-${{ github.run_id }}
          delete-branch: false
          commit-message: |
            Update WoW Forever data (unexpected files included)

            The refresh script produced changes outside src/data/characters/
            and src/data/talent-trees/. This PR must be reviewed before merge.
          title: Update WoW Forever data (needs review)
          body: |
            Automated refresh produced changes outside `src/data/characters/` and `src/data/talent-trees/`:

            ```
            ${{ steps.changes.outputs.changed_files }}
            ```

            This PR will **not** auto-merge. It needs Seth's go-ahead.
          labels: data

      - name: Comment when pre-merge build fails
        if: >
          steps.changes.outputs.has_changes == 'true' &&
          steps.changes.outputs.data_only == 'true' &&
          steps.prebuild.outcome == 'failure' &&
          steps.cpr_data.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr_data.outputs.pull-request-number }}
        run: >
          gh pr comment "${PR_NUMBER}" --body "Auto-merge skipped because \`npm ci && npm run build\` failed in the refresh workflow.
          This PR needs Seth's go-ahead."

      - name: Auto-merge data-only PR after build
        if: >
          steps.changes.outputs.has_changes == 'true' &&
          steps.changes.outputs.data_only == 'true' &&
          steps.prebuild.outcome == 'success' &&
          steps.cpr_data.outputs.pull-request-operation == 'created' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr_data.outputs.pull-request-number }}
          PR_BRANCH: ${{ steps.cpr_data.outputs.pull-request-branch }}
          PR_SHA: ${{ steps.cpr_data.outputs.pull-request-head-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ] || [ -z "${PR_BRANCH}" ] || [ -z "${PR_SHA}" ]; then
            echo "Missing pull request outputs; leaving the PR for review."
            exit 1
          fi

          gh workflow run ci.yml --ref "${PR_BRANCH}"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow=ci.yml --branch="${PR_BRANCH}" --limit 20 --json databaseId,headSha,event --jq "[.[] | select(.headSha==\"${PR_SHA}\" and .event==\"workflow_dispatch\")][0].databaseId // empty")
            if [ -n "${RUN_ID}" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "${RUN_ID}" ]; then
            echo "Timed out waiting for the dispatched CI run to start. The PR will stay open."
            gh pr comment "${PR_NUMBER}" --body "Auto-merge skipped: the dispatched CI \`build\` check never started. This PR needs Seth's go-ahead."
            exit 1
          fi

          if ! gh run watch "${RUN_ID}" --exit-status; then
            gh pr comment "${PR_NUMBER}" --body "Auto-merge skipped because the required \`build\` check failed. This PR needs Seth's go-ahead."
            exit 1
          fi

          gh pr merge "${PR_NUMBER}" --squash --body "Automated data refresh. Squash-merged by the Refresh character data workflow after the required build check passed. Only files under src/data/characters/ and src/data/talent-trees/ were changed."

          gh workflow run deploy.yml --ref "${DEFAULT_BRANCH}"
